services:
  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    depends_on:
      - database
    container_name: server
    ports:
      - "8000:8000"
    environment:
      POSTGRES_DATABASE: learnHUB
      POSTGRES_USER: server
      POSTGRES_PASSWORD: server
      POSTGRES_HOST: database
      POSTGRES_PORT: 5432
      POSTGRES_SSLMODE: disable

      SERVE_HOST: 0.0.0.0
      SERVE_PORT: 8000

      JWT_PAYLOAD_ISSUER: learnHub-OS
      JWT_SECRET_KEY: secret
      JWT_ACCESS_DURATION_HOUR: 1
      JWT_REFRESH_DURATION_HOUR: 24
    restart: unless-stopped
    
  database:
    image: postgres:18
    container_name: database
    environment:
      POSTGRES_DB: learnHUB
      POSTGRES_USER: server
      POSTGRES_PASSWORD: server
  
  pgadmin:
    image: dpage/pgadmin4:9.12.0
    container_name: pgadmin
    depends_on:
      - database
    environment:
      PGADMIN_DEFAULT_EMAIL: root@mail.ru
      PGADMIN_DEFAULT_PASSWORD: secret
    ports:
      - "8001:80"
      - "8443:443"