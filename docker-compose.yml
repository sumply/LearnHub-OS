version: "3.9"

services:
  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    depends_on:
      - database
    container_name: server
    ports:
      - "8000:8000"
    environment:
      POSTGRES_DATABASE: learnHUB
      POSTGRES_USER: server
      POSTGRES_PASSWORD: secret
      POSTGRES_HOST: database
      POSTGRES_PORT: 5432
      POSTGRES_SSLMODE: disable

      SERVE_HOST: 0.0.0.0
      SERVE_PORT: 8000
    restart: unless-stopped
  database:
    build:
      context: ./database
      dockerfile: Dockerfile
    container_name: database
    environment:
      POSTGRES_DB: learnHUB
      POSTGRES_USER: server
      POSTGRES_PASSWORD: secret